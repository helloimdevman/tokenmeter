name: update-prices

# 스펙 7.5: 내장 가격·경로 표를 매일 한 번 다시 만들어 PR 하나(bot/prices)를 열거나 갱신한다. main에 바로 밀지 않는다.
# PR은 GITHUB_TOKEN으로 연다. 저장소 설정 "Allow GitHub Actions to create and approve pull requests"가 켜져 있어야 한다.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-prices

jobs:
  # 의존성 빌드 스크립트가 도는 동안 쓰기 토큰이 없다.
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.gen.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: gen
        # 생성기가 지키는 조건을 어기면 여기서 실패하고 PR은 열리지 않는다. LiteLLM은 그 순간 main의 SHA로 받는다.
        run: |
          litellm=$(git ls-remote https://github.com/BerriAI/litellm refs/heads/main | cut -f1)
          test -n "$litellm"
          curl -fsSL --retry 3 https://models.dev/api.json -o "$RUNNER_TEMP/models-dev.json"
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/BerriAI/litellm/$litellm/model_prices_and_context_window.json" -o "$RUNNER_TEMP/litellm.json"
          python3 scripts/gen-prices.py --models-dev "$RUNNER_TEMP/models-dev.json" --litellm "$RUNNER_TEMP/litellm.json" \
            > "$RUNNER_TEMP/moves.md" 2> "$RUNNER_TEMP/summary.txt" || { cat "$RUNNER_TEMP/summary.txt" >&2; exit 1; }
          cat "$RUNNER_TEMP/summary.txt" "$RUNNER_TEMP/moves.md"
          if git diff --quiet native/meter/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          ids() { grep -v '^#' | cut -f2 | sort -u; }
          git show HEAD:native/meter/data/routes.tsv | ids > "$RUNNER_TEMP/old-ids"
          ids < native/meter/data/routes.tsv > "$RUNNER_TEMP/new-ids"
          added=$(comm -13 "$RUNNER_TEMP/old-ids" "$RUNNER_TEMP/new-ids" | xargs)
          removed=$(comm -23 "$RUNNER_TEMP/old-ids" "$RUNNER_TEMP/new-ids" | xargs)
          # shellcheck disable=SC2016 # 작은따옴표 안의 `는 마크다운이다
          {
            printf 'Refreshes `native/meter/data` with `scripts/gen-prices.py` (spec 7.5).\n\n'
            printf -- '- models.dev: `https://models.dev/api.json`, sha256 `%s`\n' "$(sha256sum "$RUNNER_TEMP/models-dev.json" | cut -d' ' -f1)"
            printf -- '- LiteLLM: [`BerriAI/litellm@%s`](https://github.com/BerriAI/litellm/blob/%s/model_prices_and_context_window.json)\n' "$litellm" "$litellm"
            printf -- '- Providers added: %s\n' "${added:-none}"
            printf -- '- Providers removed: %s\n' "${removed:-none}"
            printf -- '- %s\n\n' "$(cat "$RUNNER_TEMP/summary.txt")"
            if [ -s "$RUNNER_TEMP/moves.md" ]; then cat "$RUNNER_TEMP/moves.md"; else echo 'No price moved more than 5x.'; fi
            printf '\nThe full `cargo test` passed in the `generate` job. Before merging, close and reopen this PR so `test.yml` runs: a PR opened with `GITHUB_TOKEN` starts no other workflow.\n'
          } > pr-body.md
      - if: steps.gen.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - if: steps.gen.outputs.changed == 'true'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev pkg-config
      # fixture의 route·model_label 단언이 새 표로 도는지 본다
      - if: steps.gen.outputs.changed == 'true'
        run: cargo test --manifest-path native/Cargo.toml
      - if: steps.gen.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prices
          path: |
            native/meter/data/prices.tsv
            native/meter/data/routes.tsv
            pr-body.md
          if-no-files-found: error

  # 빌드 없음: 아티팩트의 표만 커밋한다.
  pr:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prices
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c bot/prices
          git add -u native/meter/data  # -u: 루트 .gitignore의 data/에 걸려도 추적 중인 두 표는 담긴다
          git commit -m "chore(prices): refresh snapshot"
          # checkout이 토큰을 남기지 않으므로 이 push에만 준다
          # shellcheck disable=SC2016 # $GH_TOKEN은 git이 부르는 도우미 셸에서 풀린다
          git -c credential.helper= -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' \
            push --force origin HEAD:refs/heads/bot/prices
          pr=$(gh pr list --head bot/prices --base "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body-file pr-body.md
          else
            gh pr create --head bot/prices --base "$GITHUB_REF_NAME" --title "chore(prices): refresh snapshot" --body-file pr-body.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
