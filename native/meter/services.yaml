# Adapter fields: docs/add-service.md. Built-in adapters: native/meter/adapters/.

settings:
  # 라이브 세션이 0개가 된 뒤 데몬이 스스로 종료하기까지의 분 (0 = 종료 안 함)
  idle_exit_minutes: 30
  # 종료 훅을 못 받고 남은 라이브 세션 파일을 정리하는 기준 시간
  live_ttl_hours: 6
  # 파일 감시 폴백 폴링 주기 (초). watchdog 이벤트를 놓쳐도 이 주기로 다시 훑음
  poll_seconds: 2.0
  # 세션 단위 기록을 몇 개까지 남길지 (오래된 것부터 버림). 세션 수 집계의 근거가 된다
  session_history: 500
  # 확인 필요 알림의 기존 스위치 (0 = 끄기, 그 밖의 값 = 켜기).
  # 사용자 설정의 attention_notify: true|false 가 있으면 그 값을 우선한다.
  idle_notify_seconds: 90
  overlay:
    fps: 60
    scale: 1.0
    position: [40, 80]
    # 게이지가 만땅이 되는 기준 (출력 tok/s). 세션 하나가 대략 40 tok/s 이므로
    # 3000 이면 웬만해선 안 차고, 정말 많이 돌 때만 바늘이 끝까지 갑니다.
    full_scale: 3000
  # 레거시 자체 호스팅 랭킹. 제품 소셜 면은 league 다. endpoint 가 비면 네트워크를 안 탄다.
  #   올라가는 것 : 핸들 + 토큰·비용 합계 + 모델별 내역
  #   안 올라가는 것: 프로젝트명, 경로, 세션 내용
  leaderboard:
    endpoint: ""          # 예: https://<프로젝트>.supabase.co/rest/v1/leaderboard
    handle: ""            # 비우면 로그인 계정 이름
    sync_seconds: 60      # 업로드·조회 주기
    headers: {}           # 예: {apikey: "...", Authorization: "Bearer ...", Prefer: "resolution=merge-duplicates"}
    # 엔드포인트는 분류해서 올립니다. 저명한 공개 엔드포인트(api.anthropic.com,
    # api.openai.com, openrouter.ai, bedrock, vertex …)는 native/meter/src/board.rs 에 기본
    # 탑재돼 이름 그대로 올라가고, 그 밖의 주소는 전부 self-hosted 한 칸으로 뭉쳐집니다.
    # 관리자가 검증해 공개해도 된다고 판단한 호스트만 여기에 덧붙이세요.
    # 레거시 리더보드에만 적용되고, 리그 통계(share)에는 쓰지 않습니다(늘 self-hosted).
    public_endpoints: []  # 예: ["llm.mycorp.com"]
  # Token League 서버. 비우면 리그·동기화가 네트워크를 한 번도 쓰지 않습니다.
  # 익명 사용 통계는 `tokenmeter share on` 일 때만 보냅니다.
  league:
    server: https://api.tokenmeter.online
