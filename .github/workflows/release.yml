name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  native:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            tag: linux-x64
          - os: ubuntu-24.04-arm
            tag: linux-arm64
          - os: macos-latest
            tag: macos-arm64
          - os: macos-15-intel
            tag: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev pkg-config
      - run: cargo build --release --bins --manifest-path native/Cargo.toml
      - run: |
          mkdir -p dist
          cp native/target/release/tokenmeter "dist/tokenmeter-${{ matrix.tag }}"
          cp native/target/release/tokenmeter-hook "dist/tokenmeter-hook-${{ matrix.tag }}"
          (cd dist && shasum -a 256 tokenmeter-${{ matrix.tag }} tokenmeter-hook-${{ matrix.tag }} > SHA256SUMS-${{ matrix.tag }})
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.tag }}
          path: dist/

  publish:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - run: cat dist/SHA256SUMS-* | tee dist/SHA256SUMS
      # Immutable releases reject uploads after publishing, so fill a draft first and publish it last.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            dist/tokenmeter-linux-x64
            dist/tokenmeter-hook-linux-x64
            dist/tokenmeter-linux-arm64
            dist/tokenmeter-hook-linux-arm64
            dist/tokenmeter-macos-arm64
            dist/tokenmeter-hook-macos-arm64
            dist/tokenmeter-macos-x64
            dist/tokenmeter-hook-macos-x64
            dist/SHA256SUMS
      - run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
