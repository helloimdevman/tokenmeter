name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  native:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            tag: linux-x64
          - os: ubuntu-24.04-arm
            tag: linux-arm64
          - os: macos-latest
            tag: macos-arm64
          - os: macos-15-intel
            tag: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev pkg-config
      - run: cargo build --release --bins --manifest-path native/Cargo.toml
      - run: |
          mkdir -p dist
          cp native/target/release/tokenmeter "dist/tokenmeter-${{ matrix.tag }}"
          cp native/target/release/tokenmeter-hook "dist/tokenmeter-hook-${{ matrix.tag }}"
          (cd dist && shasum -a 256 tokenmeter-${{ matrix.tag }} tokenmeter-hook-${{ matrix.tag }} > SHA256SUMS-${{ matrix.tag }})
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.tag }}
          path: dist/

  publish:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: cat dist/SHA256SUMS-* | tee dist/SHA256SUMS
      # Immutable releases reject uploads after publishing, so fill a draft first and publish it last.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            dist/tokenmeter-linux-x64
            dist/tokenmeter-hook-linux-x64
            dist/tokenmeter-linux-arm64
            dist/tokenmeter-hook-linux-arm64
            dist/tokenmeter-macos-arm64
            dist/tokenmeter-hook-macos-arm64
            dist/tokenmeter-macos-x64
            dist/tokenmeter-hook-macos-x64
            dist/SHA256SUMS
      - run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
