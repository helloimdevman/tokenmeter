label: Grok CLI
roots: ["~/.grok/sessions"]
patterns: ["**/updates.jsonl"]
match:
  params.update.sessionUpdate:
    - turn_completed
    - agent_thought_chunk
    - agent_message_chunk
# turn_completed 는 그 턴 하나의 사용량이다 (세션 누적이 아니다).
# thought/message 청크에는 usage 가 없어서 본문 길이로 출력을 추정하다가,
# 턴이 끝나면 공식 outputTokens 와의 차만 더한다.
mode: delta
key: params._meta.eventId
input_includes_cache: true
fields:
  input: params.update.usage.inputTokens
  cache_read: params.update.usage.cachedReadTokens
  cache_write: params.update.usage.cacheCreationTokens
  output: params.update.usage.outputTokens
duration_ms: params.update.usage.apiDurationMs
live_chars: params.update.content.text
# 지금 컨텍스트 점유는 스트리밍 줄(tool_call/agent_message_chunk)에만 있고
# turn_completed 에는 없다. 비워 두면 그 턴이 부른 API 호출 전부의 입력 합계를
# 컨텍스트로 오인해 ctx% 가 늘 100% 가 되므로, 없는 경로를 못 박아 ctx% 를 비운다.
ctx_tokens: params._meta.totalTokens
# cwd 는 레코드에 없다 (세션 디렉토리 이름에만 있다). 프로젝트명은 훅이 남긴
# 라이브 파일에서 온다 — 같은 sessionId 로 붙는다.
context:
  session: params.sessionId
# 모델명은 usage.modelUsage 의 '키' 라서 dot-path 로 집을 수 없다
default_model: grok-4.6-build
vendor: xai
plan_probe:
  path: ~/.grok/models_cache.json
  key: auth_method
  map: {session: subscription, api_key: api}
  default: unknown
endpoint_probe:
  path: ~/.grok/models_cache.json
  key: origin
  default: https://api.x.ai/v1
# Grok CLI 는 ~/.grok/hooks/*.json 을 훅 소스로 읽는다 (Claude settings 와 같은 형식).
# compat 으로 ~/.claude/settings.json 도 읽지만 그 엔트리는 서비스명이 claude-code 라
# grok 세션이 남의 이름으로 기록된다 — 자기 훅을 따로 깔아야 프로젝트가 붙는다.
install:
  target: claude_json
  path: ~/.grok/hooks/tokenmeter.json
  events: [SessionStart, UserPromptSubmit, Notification, Stop, SessionEnd]
