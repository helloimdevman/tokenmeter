label: Cherry Studio
# 에이전트 세션은 앱 안에서 도는 Claude Agent SDK의 기록이다(Claude Code JSONL 그대로).
# Data/Agents 아래가 지금 위치, 바로 아래 .claude는 옛 위치다. 같은 세션이 둘 다 있어도 키가 한 번만 센다.
roots:
  - "~/Library/Application Support/CherryStudio/Data/Agents/.claude/projects"
  - "~/Library/Application Support/CherryStudio/.claude/projects"
  - "${XDG_CONFIG_HOME:-~/.config}/CherryStudio/Data/Agents/.claude/projects"
  - "${XDG_CONFIG_HOME:-~/.config}/CherryStudio/.claude/projects"
patterns: ["**/*.jsonl"]
match:
  type: assistant
# 호출 하나를 3–4번 붙여 쓴다(tokscale cherrystudio.rs:11-20). 키와 큰 값 유지는 claude-code와 같다.
mode: delta
key: ["message.id & requestId", "sessionId & message.id"]
timestamp: timestamp
fields:
  input: message.usage.input_tokens
  cache_read: message.usage.cache_read_input_tokens
  cache_write: message.usage.cache_creation_input_tokens
  output: message.usage.output_tokens
context:
  cwd: cwd
  model: message.model
  session: sessionId
subagent: isSidechain
