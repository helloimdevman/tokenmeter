label: Prime Agent
# 세션 디렉터리와 그 형제 session-artifacts(RLM 자식 <root>/<sub-*>/<child>.jsonl).
# settings.json의 sessionDir은 읽지 않는다.
roots:
  - "${PRIME_AGENT_SESSION_DIR:-${PRIME_AGENT_CODING_AGENT_DIR:-~/.prime/agent}/sessions}"
  - "${PRIME_AGENT_SESSION_DIR:-${PRIME_AGENT_CODING_AGENT_DIR:-~/.prime/agent}/sessions}/../session-artifacts"
patterns: ["**/*.jsonl"]
# child_usage_attributed 줄(부모가 자식 사용량을 모은 장부)은 type: message가 아니라 match에서 빠진다.
# 포크 복사본의 부모 메시지는 자식 몫을 더한 값일 수 있어, 원본보다 늦은 머리 줄 시각으로 거른다.
match:
  type: message
  message.role: assistant
  message.model: {$exists: true}
mode: delta
# 포크 복사본은 원래 id·시각을 그대로 갖는다(pi 형식, pi.md §3·§7)
key: [message.responseId, "id & timestamp"]
timestamp: timestamp
replay_gate: true
fields:
  # input은 캐시를 뺀 값, output은 추론을 포함한다(pi 형식)
  input: message.usage.input
  cache_read: message.usage.cacheRead
  cache_write: message.usage.cacheWrite
  output: message.usage.output
cost_usd: message.usage.cost.total
context:
  session: {path: id, when: {type: session}}
  cwd: {path: cwd, when: {type: session}}
  model: message.model
  vendor: message.provider
default_model: default
