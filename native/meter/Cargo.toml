[package]
name = "tokenmeter"
version = "0.1.0"
edition = "2021"
description = "Native TokenMeter daemon and overlay — this crate is the product runtime"
publish = false

[[bin]]
name = "tokenmeter"
path = "src/bin/tokenmeter.rs"

[dependencies]
ctrlc = { version = "3", features = ["termination"] }
eframe = { version = "0.31", default-features = true }
egui = "0.31"
glob = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
ruzstd = "0.9"
iroh = { version = "1.2", default-features = false, features = ["tls-ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokenmeter-hook = { path = "../hook" }
tokenmeter-protocol = { path = "../protocol" }
tokio = { version = "1", features = ["rt", "sync", "time", "io-util", "macros"] }
ureq = { version = "2", features = ["json"] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "0.30", default-features = false }
objc2 = "0.5.2"
objc2-foundation = { version = "0.2.2", features = ["NSString", "NSGeometry", "NSThread", "NSArray", "NSEnumerator", "NSAttributedString", "NSDictionary"] }
objc2-app-kit = { version = "0.2.2", features = ["NSApplication", "NSRunningApplication", "NSResponder", "NSView", "NSWindow", "NSScreen", "NSEvent", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSButtonCell", "NSCell", "NSControl", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSMenu", "NSMenuItem", "NSAppearance", "NSFont", "NSFontDescriptor", "NSAttributedString", "NSAccessibilityProtocols", "NSColor"] }
