<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TokenMeter 초대</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: Pretendard, "Pretendard Variable", system-ui, sans-serif;
      margin: 2.5rem 1.25rem;
      line-height: 1.5;
      max-width: 36rem;
    }
    h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
    p { margin: 0.5rem 0; }
    code {
      display: block;
      font-size: 1.05rem;
      user-select: all;
      padding: 0.75rem 0.9rem;
      background: Canvas;
      border: 1px solid ButtonBorder;
    }
    button { margin-top: 0.75rem; padding: 0.45rem 0.9rem; }
    .ok { margin-left: 0.5rem; }
  </style>
</head>
<body>
  <h1>TokenMeter 팀 초대</h1>
  <p>터미널에 붙여 넣으면 이 방에 참가합니다.</p>
  <p><code id="cmd">tokenmeter league join &lt;id&gt;</code></p>
  <button type="button" id="copy">명령 복사</button>
  <span class="ok" id="ok" hidden>복사했습니다</span>
  <p>아직 없다면 <code style="display:inline;padding:0.15rem 0.35rem">curl -fsSL https://raw.githubusercontent.com/helloimdevman/tokenmeter/main/install.sh | sh</code></p>
  <script>
    (function () {
      var parts = location.pathname.split("/").filter(Boolean);
      var id = parts[0] === "j" ? (parts[1] || "") : (parts[parts.length - 1] || "");
      var cmd = "tokenmeter league join " + id;
      var el = document.getElementById("cmd");
      if (el) el.textContent = cmd;
      var btn = document.getElementById("copy");
      var ok = document.getElementById("ok");
      if (!btn) return;
      btn.addEventListener("click", function () {
        var done = function () {
          if (ok) { ok.hidden = false; }
          btn.textContent = "복사됨";
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(cmd).then(done).catch(done);
        } else {
          done();
        }
      });
    })();
  </script>
</body>
</html>
