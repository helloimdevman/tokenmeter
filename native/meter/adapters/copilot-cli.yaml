label: GitHub Copilot CLI
# 요청마다 한 행(CLI 1.0.70부터 앱 사용량도 여기에 쌓인다). 옛 session-state 종료 기록과
# 앱의 data.db는 읽지 않는다(읽으면 소스 사이 우선순위 규칙이 필요하다, 스펙 6.1).
roots: ["${COPILOT_HOME:-~/.copilot}"]
patterns: ["session-store.db"]
format: sqlite
# 행은 덧붙이기만 한다(제자리 고쳐 쓰기 없음). 그래서 커서는 id로 충분하다.
cursor: id
query:
  # 열은 버전마다 다르다: 앞에서부터 처음 준비되는 쿼리(tokscale 스키마 → TokenTracker v6 스키마)
  - |
    SELECT e.id, e.session_id, e.model, e.copilot_usage_model,
      e.input_tokens, e.output_tokens, e.cache_read_tokens, e.cache_write_tokens,
      e.total_nano_aiu, e.duration_ms, e.created_at, s.cwd, s.created_at AS session_created
    FROM assistant_usage_events e LEFT JOIN sessions s ON s.id = e.session_id
    WHERE e.id >= ?1 AND TRIM(COALESCE(e.session_id, '')) <> ''
  - |
    SELECT id, session_id, model, input_tokens, output_tokens, cache_read_tokens,
      cache_write_tokens, created_at
    FROM assistant_usage_events
    WHERE id >= ?1 AND TRIM(COALESCE(session_id, '')) <> ''
mode: delta
key: "session_id & id"
# input_tokens는 두 캐시를 포함하고, output_tokens는 추론을 포함한다
input_includes: [cache_read, cache_write]
fields:
  input: input_tokens
  cache_read: cache_read_tokens
  cache_write: cache_write_tokens
  output: output_tokens
# 1e11 nano-AIU = 1 USD (tokscale copilot_session_store.rs:13)
cost_usd: total_nano_aiu * 0.00000000001
duration_ms: duration_ms
timestamp: [created_at, session_created]
context:
  session: session_id
  cwd: cwd
  model: [copilot_usage_model, model]
default_model: auto
vendor: github-copilot
