label: OpenCode
roots:
  - "~/.local/share/opencode/storage/message"
  - "~/.opencode/storage/message"
patterns: ["**/*.json"]
format: json
match:
  role: assistant
# 메시지 파일은 생성 시점(토큰 0)과 완료 시점에 각각 쓰인다 → 누적 모드로 차이만 반영
mode: cumulative
key: id
input_includes_cache: false
fields:
  input: tokens.input
  cache_read: tokens.cache.read
  cache_write: tokens.cache.write
  output: tokens.output
context:
  cwd: path.cwd
  model: modelID
  session: sessionID
  vendor: providerID
default_model: default
# 프로바이더 키를 직접 넣어 쓰는 구조라 종량제로 본다 (구독 게이트웨이면 subscription 으로)
plan: api
endpoint_probe:
  # 프로바이더마다 URL 이 다르다 → $ctx.vendor 에 providerID 가 들어간다
  path: ~/.config/opencode/opencode.json
  key: provider[$ctx.vendor].options.baseURL
install:
  target: opencode_plugin
  path: ~/.config/opencode/plugin/tokenmeter.js
  events: [SessionStart]
